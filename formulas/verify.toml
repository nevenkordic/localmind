# Default multi-model verify formula for `llm run`.
# Stages consult each other: planner drafts, worker acts, verifier checks.
# On pass, learnings are distilled into kind=skill memories.
#
# Quality bar is domain-agnostic: complete, accurate work — not stubs.

[formula]
name = "verify"
description = "Plan, act, and cross-verify a task with local models"
max_verify_retries = 3

[[stages]]
name = "plan"
role = "planner"
prompt = """Plan COMPLETE, accurate delivery for this task (any domain).

TASK:
{{task}}

CONTEXT:
{{memory}}

List concrete steps, files/commands/evidence needed, and risks.
No stub/placeholder plans. Max 220 words."""
output = "plan"

[[stages]]
name = "act"
role = "worker"
prompt = """Execute the plan with real tools. Deliver finished, accurate work —
not scaffolding, TODOs, or toy demos. Verify your own claims with tools
(read back files, run tests/commands when relevant) before declaring done.

TASK:
{{task}}

PLAN:
{{plan}}

VERIFIER FEEDBACK (may be empty — if present, fix every issue thoroughly):
{{feedback}}"""
input = "plan"
output = "result"
when = "plan.exists"

[[stages]]
name = "verify"
role = "verifier"
