name: Release

# Intentional releases only — not on every push/PR/merge.
# Trigger by either:
#   1. Pushing a version tag (v2.0.0), or
#   2. Actions → Release → Run workflow (workflow_dispatch)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create (e.g. v2.0.0). Must start with v. Ignored on tag pushes.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Publish as a draft GitHub release'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      draft: ${{ steps.check.outputs.draft }}
    steps:
      - id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${{ github.ref_name }}"
            draft="false"
          else
            tag="${{ inputs.version }}"
            draft="${{ inputs.draft }}"
            if [[ -z "$tag" ]]; then
              echo "::error::version input is required for workflow_dispatch"
              exit 1
            fi
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::version must look like v2.0.0 (got: $tag)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (draft=$draft, event=${{ github.event_name }})"

  build:
    name: ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: ''
          - target: aarch64-apple-darwin
            os: macos-14
            ext: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          mkdir -p dist
          asset="llm-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/llm${{ matrix.ext }}" "dist/${asset}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${asset}" > "${asset}.sha256"
          else
            shasum -a 256 "${asset}" > "${asset}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: llm-${{ matrix.target }}
          path: dist/*

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list artifacts
        run: ls -la dist

      - name: ensure tag exists
        shell: bash
        run: |
          tag="${{ needs.validate.outputs.tag }}"
          git fetch --tags --force
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
            echo "Created and pushed tag $tag"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ${{ needs.validate.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: ${{ needs.validate.outputs.draft == 'true' }}
